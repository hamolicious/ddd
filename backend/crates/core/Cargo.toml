[package]
name = "ddd-core"
description = "Shared ddd core: document parsing, title resolution, filter DSL. Compiles natively (server) and to wasm32 (client kernel)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["mongo"]
mongo = ["dep:bson"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
bson = { version = "2.15.0", optional = true }
wasm-bindgen = { version = "0.2.128", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

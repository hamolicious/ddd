[package]
name = "life-manager-server"
description = "Life Manager server: REST API, CRDT document store, auth, attachments."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "life-manager"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart", "macros", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
bson = "2.15.0"
bytes = "1.12.1"
# M4: secret encryption at rest for `plugin_config` (SPEC §6.2). XChaCha20-Poly1305
# rather than AES-GCM: a 192-bit random nonce makes reuse a non-issue at the volume
# of writes an admin config screen produces, and it needs no AES hardware story.
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
# M4: the Wasm plugin host (SPEC §6.3). Brings wasmtime; epoch interruption and the
# memory limiter are what enforce the per-call wall clock and the 128 MB cap.
extism = "1.30.0"
futures = "0.3.34"
hex = "0.4.3"
# M4: HKDF-SHA256 for the `CONFIG_KEY` fallback derived from `SESSION_SECRET`.
hkdf = "0.13.0"
hmac = "0.13.0"
# M4: `http_request` resolves the declared host itself and pins the address it
# dialled, so an allowlisted name cannot be re-resolved to 169.254.169.254 between
# the check and the connection (SPEC §6.2).
hickory-resolver = "0.26.3"
infer = "0.22.0"
ipnet = "2.12.2"
life-manager-core = { path = "../core", features = ["mongo"] }
life-manager-plugin-abi = { path = "../plugin-abi" }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
mongodb = "3.9.1"
rand = "0.10.3"
# M4: the outbound half of `http_request`. `default-features = false` keeps
# OpenSSL out (rustls only) and `resolve_to_addrs` is what makes resolve-then-pin
# expressible without hand-rolling a connector.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream", "charset", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = { version = "0.5.3", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "limit", "timeout", "request-id", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ulid = "3.0.0"
yrs = "0.28.0"
zip = "8.6.0"
similar = "3.2.0"

# CONTRACTS.md freezes the dependency list; this is the one addition, and it is
# test-only. The M2 sync layer cannot be integration-tested without a WebSocket
# *client*, and `tokio-tungstenite` is already in `Cargo.lock` — axum's `ws`
# feature depends on it — so this adds no package, no version churn, and nothing
# to the shipped binary. Announced in the sync area's report for sign-off.
[dev-dependencies]
tokio-tungstenite = "0.29.0"

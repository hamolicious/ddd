[package]
name = "ddd-plugin-sdk"
description = "Write a ddd backend plugin in Rust: the typed host ABI over Extism PDK, and the export macros the host looks for."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
extism-pdk = { version = "1.4.1", default-features = false }
ddd-plugin-abi = { path = "../plugin-abi" }
ddd-core = { path = "../core", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

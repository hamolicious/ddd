[package]
name = "ddd-plugin-abi"
description = "The ddd backend-plugin host ABI: every host-function input/output, hook payload, cron invocation and error shape, as serde types. One definition, used by the server host and by the plugin SDK."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

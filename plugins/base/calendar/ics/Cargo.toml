[package]
name = "calendar-ics"
description = "iCalendar (RFC 5545) parsing for the calendar plugin: pure, host-testable, no Extism."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# **The pattern worth copying.** A Wasm plugin crate cannot be unit-tested on the host
# target — it links the Extism host imports, so a host-target test binary fails at link
# time. So the logic that deserves tests lives in a plain crate with no SDK dependency,
# and the plugin crate is glue:
#
#   cargo test -p calendar-ics --target x86_64-unknown-linux-gnu
#
# (the explicit target overrides the wasm32 default in `plugins/.cargo/config.toml`;
# `mise run plugin-test` is the same command).

[dependencies]
serde = { workspace = true }

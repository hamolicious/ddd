# The **backend halves** of plugins: a separate Cargo workspace from `backend/`,
# because everything here compiles to `wasm32-unknown-unknown` and links the Extism
# PDK's host imports. Keeping them out of the server workspace is what lets
# `cargo test --workspace --all-targets` stay green on the host target.
#
# `mise run wasm-plugins` builds every member and copies the artifact into the
# installed layout (`<id>/<version>/backend.wasm`), next to the frontend half that
# `mise run plugins` writes.
#
# Since `calendar` was removed (2026-09-24) the only member is the host's fixture,
# `examples/hello-backend` — no plugin in `plugins/base/` has a backend half, so
# `wasm-plugins` installs nothing there and only builds the fixture. Add a member here the
# moment a plugin needs cron, outbound HTTP or a webhook (SPEC §6.3).
[workspace]
resolver = "3"
members = ["examples/hello-backend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
ddd-plugin-sdk = { path = "../backend/crates/plugin-sdk" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Wasm plugins are shipped: optimize for size, and let a panic be a trap rather than
# 200 KB of formatting machinery. A trap poisons the instance and the host counts it as
# a failure, which is the right outcome for a bug that reached `unwrap`.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# AGP 9 removed `getDefaultProguardFile('proguard-android.txt')` — it bundles `-dontoptimize`,
# which stops R8 optimizing — and this flag is AGP's own transitional opt-out.
#
# It is here for a **dependency**, not for us: `flutter_inappwebview_android` 1.1.3 (the
# newest stable, pulled in by `flutter_inappwebview` ^6.1.5) still calls it in its
# `android/build.gradle`, so without this the build fails while *evaluating that project* —
# before a line of our code is compiled. Nothing in `app/` names that file.
#
# The cost is nil in practice: those `proguardFiles` sit in a library module's `buildTypes`,
# where they configure only that module's own (never-run) minification — `consumerProguardFiles`
# is what an AAR actually propagates to us — and our debug builds do not minify at all.
#
# Remove this line when `flutter_inappwebview` ships a stable release that has stopped calling
# it (6.2.0's betas already have), and confirm with `mise run shell-apk`. Keeping a dead
# compatibility flag is how a build ends up pinned to a toolchain nobody chose.
android.r8.proguardAndroidTxt.disallowed=false
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.workers.max=2
org.gradle.parallel=false

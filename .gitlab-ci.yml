# CI.
#
#   * The server image: built, published to
#     registry.slayhouse.net/public-artifacts/image/life-manager-server and deployed to the
#     homelab on every push to master and on tags.
#   * The Android APK and the Linux desktop shell: manual jobs, in every pipeline. Press play;
#     the result is the job's artifacts; the APK is also published to
#     gitlab.slayhouse.net/public-artifacts/android, the desktop shell to
#     gitlab.slayhouse.net/public-artifacts/cli (Deploy → Package registry on each).
#
# The shared homelab template does the server work: `build` pushes to this project's
# registry, `publish-image` retags that into public-artifacts with the group's
# IMAGES_DEPLOY_TOKEN, `deploy-image` bumps the tag in homelab/k8. What differs from it:
#
#   * `build` is replaced by `server-image`, so the pipeline says which build it is next to
#     the shell jobs. Its Dockerfile is `backend/Dockerfile` with the repo root as context
#     (see the header of `docker-compose.yaml`), not `./Dockerfile`.
#   * `publish-image` / `deploy-image` — run automatically, but only for master and tags.
#     A pipeline started by hand ("Run pipeline") on another branch builds the image and
#     offers the manual jobs; it never publishes or deploys.
include:
  - project: "gitlab-artifacts/ci"
    file: "/homelab.gitlab-ci.yml"

variables:
  PUBLISHED_IMAGE: "life-manager-server"
  # After publishing, the template's `deploy-image` rewrites the image of the `life-manager`
  # container in homelab/k8's gitops/manifests/life-manager/deployment.yaml and argo rolls it.
  DEPLOY_HOMELAB: "true"
  GITOPS_TARGET_MANIFEST: "life-manager"
  GITOPS_TARGET_CONTAINER: "life-manager"
  # Bump with ci/android-builder.Dockerfile.
  ANDROID_BUILDER_TAG: "flutter-3.47.5-ndk-28.2.13676358"
  ANDROID_BUILDER_IMAGE: "$CI_REGISTRY_IMAGE/android-builder:$ANDROID_BUILDER_TAG"

# master, tags, and "Run pipeline" from the UI on any branch (for the manual jobs). No merge
# request or branch-push pipelines yet.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

# The template's before_script, with a wait for dind in front. The runner starts a job when
# the build container is ready, not the `docker` service, so the first daemon call can die
# with `Cannot connect to the Docker daemon at tcp://localhost:2375` (pipeline 2945's
# publish-image). Same fix as hamolicious-projects/cock.
before_script:
  - |
    for _ in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 2; done
    docker info >/dev/null 2>&1 || { echo "dind never came up on $DOCKER_HOST" >&2; exit 1; }
  - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

.ships: &ships
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_COMMIT_TAG

# An included job cannot be renamed or removed, only switched off.
build:
  rules:
    - when: never

server-image:
  stage: build
  script:
    - docker build -f backend/Dockerfile -t $DEV_IMAGE .
    - docker push $DEV_IMAGE

publish-image:
  needs: [server-image]
  dependencies: [server-image]
  rules: *ships

deploy-image:
  rules:
    - if: $DEPLOY_HOMELAB != "true"
      when: never
    - *ships

# ---------------------------------------------------------------------------------------
# Manual: the shells. Neither needs docker, so both drop the template's dind service and
# the before_script above.
# ---------------------------------------------------------------------------------------

.manual-shell:
  stage: build
  needs: []
  services: []
  rules:
    - when: manual
  # A manual job is optional; this keeps an unpressed one from holding the pipeline open.
  allow_failure: true

# The image `android-apk` runs in: Flutter, the NDK and the extra platforms preinstalled
# (see ci/android-builder.Dockerfile for why). Built on master when its Dockerfile changes;
# ANDROID_BUILDER_TAG names it, so bump that with the Dockerfile.
android-builder:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - ci/android-builder.Dockerfile
  script:
    - docker build -f ci/android-builder.Dockerfile -t "$ANDROID_BUILDER_IMAGE" ci
    - docker push "$ANDROID_BUILDER_IMAGE"

# The Flutter shell (`app/`). The same build `mise run shell-apk` does, as release rather
# than debug: smaller and faster on the phone. Release is still signed with the debug key
# (see app/android/app/build.gradle.kts) until there is a real keystore, so it installs
# over an existing debug build.
android-apk:
  extends: .manual-shell
  image: $ANDROID_BUILDER_IMAGE
  # Waits for a fresh builder image when this pipeline is building one; otherwise runs on
  # the one already in the registry.
  needs:
    - job: android-builder
      optional: true
  # A cold Gradle still downloads its dependencies; the default hour is not much headroom.
  timeout: 2h
  before_script: []
  script:
    - cd app
    - flutter pub get
    - flutter build apk --release
    - cd ..
    - mv app/build/app/outputs/flutter-apk/app-release.apk "life-manager-${CI_COMMIT_SHORT_SHA}.apk"
    # Publish to public-artifacts/android's generic package registry, the way the template's
    # bin-package does for public-artifacts/cli. Version is pubspec's (without the +build)
    # plus the commit, so every press is its own version and says what it was built from.
    - |
      version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)-${CI_COMMIT_SHORT_SHA}"
      curl --fail-with-body --location \
        --header "PRIVATE-TOKEN: $PACKAGES_DEPLOY_TOKEN" \
        --upload-file "life-manager-${CI_COMMIT_SHORT_SHA}.apk" \
        "${CI_API_V4_URL}/projects/public-artifacts%2Fandroid/packages/generic/life-manager/${version}/life-manager-${CI_COMMIT_SHORT_SHA}.apk"
  artifacts:
    name: "life-manager-apk-$CI_COMMIT_SHORT_SHA"
    paths:
      - life-manager-*.apk
    expire_in: 30 days

# The Linux desktop shell (`desktop/`, Tauri). `mise run desktop-bundle`: a .deb and an
# AppImage. Bookworm for its webkit2gtk-4.1 -- and because an AppImage only runs on
# systems with a glibc at least as new as the one it was built against, older is better.
linux-desktop:
  extends: .manual-shell
  image: rust:1-bookworm
  variables:
    # No FUSE in a CI container; linuxdeploy (itself an AppImage) must unpack itself instead.
    APPIMAGE_EXTRACT_AND_RUN: "1"
  before_script:
    - apt-get update
    # Tauri 2's Linux prerequisites.
    - apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev file patchelf
    - cargo install tauri-cli --version '^2' --locked
  script:
    - cd desktop
    - cargo tauri build
    - cd ..
    # Publish both files to public-artifacts/cli's generic package registry, as one version:
    # tauri.conf.json's version plus the commit, like the APK's. Renamed on the way out:
    # Tauri names them after productName (`Life Manager_0.1.0_amd64.deb`), and a space is not
    # something a package file name or its URL can carry.
    - |
      version="$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' desktop/tauri.conf.json | head -1)-${CI_COMMIT_SHORT_SHA}"
      mkdir -p dist
      cp desktop/target/release/bundle/deb/*.deb "dist/life-manager-desktop_${version}_amd64.deb"
      cp desktop/target/release/bundle/appimage/*.AppImage "dist/life-manager-desktop_${version}_amd64.AppImage"
      for file in dist/*; do
        curl --fail-with-body --location \
          --header "PRIVATE-TOKEN: $PACKAGES_DEPLOY_TOKEN" \
          --upload-file "$file" \
          "${CI_API_V4_URL}/projects/public-artifacts%2Fcli/packages/generic/life-manager-desktop/${version}/$(basename "$file")"
      done
  artifacts:
    name: "life-manager-desktop-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 30 days

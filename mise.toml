[tools]
rust = "latest"

# JDK for the Android build (`mise run shell-apk`). Pinned to 21, the newest LTS that
# AGP 9 and Gradle 9.3 support: newer JDKs break the build (JDK 26's jlink rejects AGP's
# java.base image). Raise it when Flutter's supported JDK range does.
java = "temurin-21"

# The Flutter SDK for the Android app (`app/`). Pinned because `app/pubspec.lock` was
# resolved against this Dart SDK, and a minor bump can change the Android build (see
# `app/README.md` § "Building the APK"). The full definition is needed because mise's
# Flutter registry entry has no download URL or checksum of its own.
flutter = { version = "3.47.5", checksum_expr = '"sha256:" + filter(fromJSON(body).releases, { #.archive endsWith filename })[0].sha256', platforms = { linux-x64 = { checksum_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json", url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_{{ version | trim_end(pat='-stable') }}-stable.tar.xz" }, macos-arm64 = { checksum_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_macos.json", url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_{{ version | trim_end(pat='-stable') }}-stable.zip" }, macos-x64 = { checksum_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_macos.json", url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_{{ version | trim_end(pat='-stable') }}-stable.zip" }, windows-x64 = { checksum_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_windows.json", url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_{{ version | trim_end(pat='-stable') }}-stable.zip" } }, version_expr = 'fromJSON(body).releases | filter({ #.channel == "stable" }) | map({ replace(#.version, "-stable", "") }) | sortVersions()', version_list_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json" }

# Every task reads `.env`. Copy `.env.example` to `.env` before your first run:
# the server refuses to start without SESSION_SECRET.
[env]
_.file = { path = ".env", redact = true }

[tasks.update-graph]
description = "Update the knowledge graph (code + docs, LLM extraction) through OpenRouter with GRAPHIFY_TOKEN from .env"
# OpenRouter speaks the OpenAI API, so graphify's `openai` backend reaches it through
# OPENAI_BASE_URL. `extract` is incremental: only files changed since the last run are
# sent. `label --missing-only` names any community the extraction left as "Community N".
run = """
#!/usr/bin/env bash
set -euo pipefail
: "${GRAPHIFY_TOKEN:?set GRAPHIFY_TOKEN in .env}"
export OPENAI_BASE_URL="https://openrouter.ai/api/v1"
export OPENAI_API_KEY="$GRAPHIFY_TOKEN"
model="anthropic/claude-sonnet-4.5"
graphify extract . --backend openai --model "$model"
graphify label . --missing-only --backend=openai --model="$model"
"""

[tasks.serve-graph]
description = "Serve graphify-out/graph.html and open it in the browser (set GRAPHIFY_OPEN=0 for headless use)"
run = """
#!/usr/bin/env bash
set -euo pipefail

graph_dir="graphify-out"
graph_file="$graph_dir/graph.html"
port="${GRAPHIFY_PORT:-8000}"
url="http://127.0.0.1:$port/graph.html"

if [[ ! -f "$graph_file" ]]; then
  echo "Missing $graph_file; run 'mise run update-graph' first." >&2
  exit 1
fi

python="python3"
if [[ -s "$graph_dir/.graphify_python" ]]; then
  python="$(<"$graph_dir/.graphify_python")"
fi

echo "Serving the graph at $url (Ctrl-C to stop)"

if [[ "${GRAPHIFY_OPEN:-1}" != "0" ]]; then
  (
    sleep 0.5
    if command -v xdg-open >/dev/null 2>&1; then
      xdg-open "$url" >/dev/null 2>&1 || echo "Could not open a browser; visit $url manually."
    elif command -v open >/dev/null 2>&1; then
      open "$url" || echo "Could not open a browser; visit $url manually."
    elif command -v cmd.exe >/dev/null 2>&1; then
      cmd.exe /c start "" "$url" >/dev/null 2>&1 || echo "Could not open a browser; visit $url manually."
    else
      echo "No browser opener found; visit $url manually."
    fi
  ) &
fi

exec "$python" -m http.server "$port" --bind 127.0.0.1 --directory "$graph_dir"
"""

[tasks.graph-plugin]
description = "Pick a plugin with fzf and open its isolated Graphify neighbourhood (optional argument prefilters; unique matches auto-select)"
raw = true
run = "scripts/graph-plugin"

[tasks.dev]
description = "Run the server against the compose Mongo (mongo in docker, server on the host), serving the built PWA + plugins"
dir = "backend"
# The paths are relative to `backend/`, where this task runs. The server's defaults are
# relative to the working directory, so unset they would find nothing from here.
#
# WEB_DIST_DIR serves the last `mise run web-build` output on http://localhost:$PORT, the
# same way production does. For live reloading use `mise run app` or `mise run dev-hot`.
run = [
  "docker compose -f ../docker-compose.yaml up -d --wait mongo",
  """
  BIND_ADDR="0.0.0.0:${PORT:-8080}" \
  WEB_DIST_DIR="${WEB_DIST_DIR:-../web/app/dist}" \
  PLUGINS_DIR="${PLUGINS_DIR:-../plugins/base/dist}" \
  KERNEL_DTS_PATH="${KERNEL_DTS_PATH:-../web/kernel-api/dist/kernel.d.ts}" \
  cargo run --bin ddd -- serve
  """,
]


[tasks.dev-hot]
description = "Hot reload ON :$PORT (8080) — Vite serves the app there (LAN-exposed) and proxies /api, /plugins and the socket to the Rust server on PORT+1"
dir = "web"
# One URL for every device: this machine, a phone's browser on the LAN
# (http://<lan-ip>:$PORT), and an adb-reversed phone. The server is told to allow Vite's
# origin on $PORT. The Android app serves its own bundle and never hot reloads; use the
# phone's browser while iterating.
run = [
  "docker compose -f ../docker-compose.yaml up -d --wait mongo",
  "npm install --no-audit --no-fund",
  """
  #!/usr/bin/env bash
  set -euo pipefail
  cleanup() { [ -n "${SERVER_PID:-}" ] && kill "$SERVER_PID" 2>/dev/null || true; }
  trap cleanup EXIT INT TERM
  PORT="${PORT:-8080}"
  SERVER_PORT=$((PORT + 1))
  ORIGINS="http://localhost:$PORT,http://127.0.0.1:$PORT"
  for host in ${APP_ORIGIN_HOSTS//,/ }; do ORIGINS="$ORIGINS,http://$host:$PORT"; done
  (
    cd ../backend
    BIND_ADDR="127.0.0.1:$SERVER_PORT" \
    APP_ORIGIN="$ORIGINS,${APP_ORIGIN:-}" \
    WEB_DIST_DIR="${WEB_DIST_DIR:-../web/app/dist}" \
    PLUGINS_DIR="${PLUGINS_DIR:-../plugins/base/dist}" \
    KERNEL_DTS_PATH="${KERNEL_DTS_PATH:-../web/kernel-api/dist/kernel.d.ts}" \
    cargo run --bin ddd -- serve
  ) &
  SERVER_PID=$!
  # Wait for the API before Vite starts proxying at it.
  for _ in $(seq 1 120); do
    curl -sf -o /dev/null "http://127.0.0.1:$SERVER_PORT/healthz" && break
    sleep 1
  done
  DDD_SERVER="http://127.0.0.1:$SERVER_PORT" npm run dev:app -- --port "$PORT" --host --strictPort
  """,
]

[tasks.check]
description = "Type-check the whole workspace (including tests) plus clippy"
dir = "backend"
run = [
  "cargo fmt --all --check",
  "cargo check --workspace --all-targets",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.fmt]
description = "Format the workspace in place"
dir = "backend"
run = "cargo fmt --all"

[tasks.test]
description = "Run the workspace test suite"
dir = "backend"
run = "cargo test --workspace --all-targets"

[tasks.build]
description = "Build the release binary (the same profile the Docker image uses)"
dir = "backend"
run = "cargo build --release --locked --bin ddd"

[tasks.wasm-check]
description = "Check the shared core builds for the client kernel (no server deps, no bson)"
dir = "backend"
run = "cargo check -p ddd-core --no-default-features"

[tasks.web]
description = "Run the web dev server (proxies /api and the sync socket to the Rust server)"
dir = "web"
run = ["npm install --no-audit --no-fund", "npm run dev"]

[tasks.app]
description = "Run the PWA dev server (the real app; proxies /api, /plugins and the socket to the Rust server)"
dir = "web"
run = ["npm install --no-audit --no-fund", "npm run dev:app"]

[tasks.kernel-dts]
description = "Generate the plugin contract (web/kernel-api/dist/kernel.d.ts), served at /kernel.d.ts"
dir = "web"
run = ["npm install --no-audit --no-fund", "npm run kernel:dts"]

[tasks.plugins]
description = "Build the base plugin distribution into plugins/base/dist (what the server serves as PLUGINS_DIR)"
dir = "web"
run = ["npm install --no-audit --no-fund", "npm run build:plugins"]

[tasks.wasm-plugins]
description = "Build every plugin's backend half (wasm32) into the installed layout next to its frontend half"
# Runs after `plugins`, whose Vite build empties each plugin's output directory.
depends = ["plugins"]
run = "node web/scripts/build-wasm-plugins.mjs"

[tasks.plugin-package]
description = "Package a built plugin as an installable .zip (`mise run plugin-package doc-list`)"
# Writes only what the installer accepts (manifest, the declared wasm module,
# `frontend/**`); a plain `zip -r` can include stray files that make the install fail.
depends = ["wasm-plugins"]
run = "node web/scripts/package-plugin.mjs"

[tasks.plugin-check]
description = "Check the plugin SDK and every plugin backend half for wasm32 (they are excluded from the backend workspace)"
# Not covered by `mise run check`: the SDK links Extism's host imports, so it only builds
# for wasm32. The target is passed explicitly because Cargo reads `.cargo/config.toml`
# from the working directory, not the manifest's.
run = [
  "cargo fmt --manifest-path backend/crates/plugin-sdk/Cargo.toml --check",
  "cargo clippy --manifest-path backend/crates/plugin-sdk/Cargo.toml --all-targets --target wasm32-unknown-unknown -- -D warnings",
  "cargo fmt --manifest-path plugins/Cargo.toml --all --check",
  "cargo clippy --manifest-path plugins/Cargo.toml --workspace --all-targets --target wasm32-unknown-unknown -- -D warnings",
]

# To unit-test a plugin's logic, put it in a plain crate beside the wasm glue and test it
# on the host (see `backend/HOST-ABI.md`).

[tasks.plugin-smoke]
description = "Build the hello-world plugin and load it in a minimal Extism host (the ABI's end-to-end check)"
depends = ["wasm-plugins"]
dir = "backend"
run = "cargo test -p ddd-server --test pluginhost_smoke"

[tasks.web-build]
description = "Build everything the server serves: the Wasm core, the contract, the PWA bundle (runtime layer + app + service worker), and the base plugins"
dir = "web"
# Depends on `wasm`: the app bundle imports the shared core from the gitignored
# `kernel/src/wasm/pkg`, which would otherwise be missing or stale.
depends = ["wasm"]
run = [
  "npm install --no-audit --no-fund",
  "npm run kernel:dts",
  "npm run build:app",
  "npm run build:plugins",
]

[tasks.web-check]
description = "Typecheck and unit-test the web tree: kernel contract, kernel runtime, PWA loader, base plugins"
dir = "web"
# Checks generated manifest types are current, then the plugin dependency graph
# (versions satisfied, no cycles, static `plugin:` imports declared), then types and tests.
run = [
  "npm install --no-audit --no-fund",
  "npm run check:generated",
  "npm run check:plugins",
  "npm run typecheck",
  "npm run test",
]

[tasks.shell-test]
description = "Format-check, analyze and unit-test the Flutter app (app/); no Android SDK needed"
dir = "app"
run = [
  "flutter pub get",
  "dart format --output=none --set-exit-if-changed lib test",
  "flutter analyze",
  "flutter test",
]

[tasks.shell-apk]
description = "Build the Android debug APK — needs an Android SDK"
dir = "app"
# Run before shipping changes to `app/android/**`, `pubspec.yaml` or the Flutter pin.
# ANDROID_HOME defaults to ~/Android/Sdk. The JDK comes from `[tools]` above.
run = '''
set -euo pipefail
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
export ANDROID_SDK_ROOT="$ANDROID_HOME"
if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
  echo "no Android SDK at $ANDROID_HOME — see app/README.md § Building the APK" >&2
  exit 1
fi
flutter build apk "${@:---debug}"
'''

[tasks.desktop-run]
description = "Linux desktop shell (Tauri, `desktop/`) against the local server on :$PORT — needs webkit2gtk-4.1"
dir = "desktop"
run = 'cargo run -- --server "${DDD_SERVER_URL:-http://localhost:${PORT:-8080}}"'

[tasks.desktop-bundle]
description = "Build the Linux desktop shell's .deb and AppImage — needs `cargo install tauri-cli --version ^2`"
dir = "desktop"
run = "cargo tauri build"

[tasks.desktop-install]
description = "Build the Linux desktop shell and install it for this user: ~/.local/bin/ddd, its icons and its launcher entry"
dir = "desktop"
# The window icon is compiled into the binary from `icons/` (rendered from `brand/`);
# the hicolor icons are what the launcher and the taskbar show.
run = '''
set -euo pipefail
cargo build --release --locked
install -Dm755 target/release/ddd-desktop "$HOME/.local/bin/ddd"
icons="$HOME/.local/share/icons/hicolor"
install -Dm644 icons/32x32.png "$icons/32x32/apps/ddd.png"
install -Dm644 icons/128x128.png "$icons/128x128/apps/ddd.png"
install -Dm644 icons/128x128@2x.png "$icons/256x256/apps/ddd.png"
install -Dm644 icons/icon.png "$icons/512x512/apps/ddd.png"
install -Dm644 ../brand/icon.svg "$icons/scalable/apps/ddd.svg"
install -Dm644 /dev/stdin "$HOME/.local/share/applications/ddd.desktop" <<EOF
[Desktop Entry]
Type=Application
Name=ddd
Comment=Dynamic database for documents
Exec=$HOME/.local/bin/ddd
Icon=ddd
Terminal=false
Categories=Office;
StartupWMClass=ddd-desktop
EOF
gtk-update-icon-cache -q -t "$icons" 2>/dev/null || true
update-desktop-database -q "$HOME/.local/share/applications" 2>/dev/null || true
echo "installed ~/.local/bin/ddd"
'''

[tasks.harness]
description = "Convergence harness against a running server"
dir = "web"
run = "npm run harness:convergence --"

[tasks.collab]
description = "Collaboration suite: people editing together, online and offline, against a real server it starts itself (needs mongo up and `cargo build --bin ddd`)"
dir = "web"
run = "npm run test:collab --"

[tasks.wasm]
description = "Build the shared core to Wasm for the client kernel (writes web/kernel/src/wasm/pkg)"
run = '''
set -euo pipefail

target="wasm32-unknown-unknown"
out="web/kernel/src/wasm/pkg"
artifact="backend/target/$target/release/ddd_core.wasm"

# The target has to be installed once: `rustup target add wasm32-unknown-unknown`.
if ! rustc --print target-list | grep -qx "$target"; then
  echo "rustc does not know $target" >&2; exit 1
fi
if ! ls "$(rustc --print sysroot)/lib/rustlib/$target" >/dev/null 2>&1; then
  echo "missing std for $target — run: rustup target add $target" >&2; exit 1
fi

# `wasm-bindgen` must match the wasm-bindgen crate version in
# backend/crates/core/Cargo.toml exactly (it refuses to run otherwise):
#   cargo install wasm-bindgen-cli --version <that version>
# or drop the prebuilt binary from the wasm-bindgen releases on your PATH.
if command -v wasm-bindgen >/dev/null 2>&1; then
  generate() { wasm-bindgen --target web --out-dir "$out" --out-name ddd_core "$artifact"; }
elif command -v wasm-pack >/dev/null 2>&1; then
  # wasm-pack drives the same code generator; it also writes a package.json we
  # do not use (the kernel imports the artifact directly through a Vite alias).
  generate() {
    wasm-pack build backend/crates/core --target web --release --out-dir "../../../$out" \
      --out-name ddd_core -- --no-default-features --features wasm
  }
else
  echo "neither wasm-bindgen nor wasm-pack is on PATH — see the comment in this task" >&2
  exit 1
fi

cd backend
cargo build -p ddd-core --target "$target" --release --no-default-features --features wasm
cd ..
mkdir -p "$out"
generate
node web/scripts/wasm-smoke.mjs
'''

[tasks.up]
description = "Build and start the full stack (mongo + server) in Docker"
run = "docker compose up --build -d"

[tasks.down]
description = "Stop the stack, keeping the Mongo volume"
run = "docker compose down"

[tasks.logs]
description = "Tail the server logs"
run = "docker compose logs -f server"

[tasks.backup]
description = "Dump the database (documents + GridFS attachments) to ./backups"
run = '''
set -euo pipefail
stamp="$(date -u +%Y%m%dT%H%M%SZ)"
out="backups/${stamp}"
mkdir -p "$out"
docker compose exec -T mongo mongodump \
  --db "${MONGO_DATABASE:-ddd}" --archive --gzip > "$out/dump.archive.gz"
echo "wrote $out/dump.archive.gz"
'''

[tasks.adb-pair]
description = "Pair with a phone over Wi-Fi debugging: mise run adb-pair <ip:pairing-port> <6-digit-code> (then auto-connects via mDNS)"
run = """
#!/usr/bin/env bash
set -euo pipefail
ADB="${ANDROID_HOME:-$HOME/Android/Sdk}/platform-tools/adb"
PAIR="{{arg(name='pair_hostport')}}"
CODE="{{arg(name='code')}}"
"$ADB" pair "$PAIR" "$CODE"
echo "Paired. Discovering connect endpoint via mDNS..."
sleep 1
SVC=$("$ADB" mdns services 2>/dev/null | awk '/_adb-tls-connect/{print $NF; exit}')
if [ -n "${SVC:-}" ]; then
  "$ADB" connect "$SVC"
else
  echo "mDNS discovery came up empty — connect manually with the IP:port from the MAIN Wireless-debugging screen:"
  echo "  $ADB connect <ip:port>"
fi
"$ADB" devices -l
"""

[tasks.shell-install]
description = "Install the shell APK on the connected phone (adb reverse + install -r); pass --logs to stream flutter logcat afterwards"
run = """
#!/usr/bin/env bash
set -euo pipefail
ADB="${ANDROID_HOME:-$HOME/Android/Sdk}/platform-tools/adb"
APK="app/build/app/outputs/flutter-apk/app-debug.apk"
[ -f "$APK" ] || { echo "no APK at $APK — build it first: mise run shell-apk"; exit 1; }
COUNT=$("$ADB" devices | awk 'NR>1 && $2=="device"' | wc -l)
[ "$COUNT" -ge 1 ] || { echo "no device attached — connect USB or: mise run adb-pair <ip:port> <code>"; exit 1; }
if [ "$COUNT" -gt 1 ] && [ -z "${ANDROID_SERIAL:-}" ]; then
  echo "multiple devices attached (often the same phone connected twice over Wi-Fi):"
  "$ADB" devices | awk 'NR>1 && $2=="device"{print "  " $1}'
  echo "either: adb disconnect <the duplicate>   or: ANDROID_SERIAL=<serial> mise run shell-install"
  exit 1
fi
PORT="${PORT:-8080}"
"$ADB" reverse "tcp:$PORT" "tcp:$PORT"
"$ADB" install -r "$APK"
echo "installed. server URL on the phone: http://127.0.0.1:$PORT"
if [ "${1:-}" = "--logs" ]; then
  "$ADB" logcat -c
  exec "$ADB" logcat -s flutter:V
fi
"""

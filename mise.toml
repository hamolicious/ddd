[tools]
rust = "latest"

# The JDK the Android build runs on (`mise run shell-apk`). Pinned to an LTS, and pinned
# *down* from whatever the machine has, because the Android toolchain is the constraint:
#
#   * AGP's `JdkImageTransform` rebuilds a `java.base` module from the platform's
#     `core-for-system-modules.jar` and feeds it to `jlink`. JDK 26's jlink refuses it —
#     "cannot find the build signature in the java.base specified on module path" — and the
#     build dies in a *dependency's* `compileDebugJavaWithJavac` with no mention of the JDK.
#   * Flutter states a supported JDK range, and 26 is years past it. `flutter build` warns
#     ("Newer than known valid Java version") and carries on into exactly that failure.
#
# 21 is the newest LTS that AGP 9 and Gradle 9.3 both support. Nothing else in this repo is
# Java, so pinning it here costs nothing elsewhere. Raise it when Flutter's supported range
# does, not when a newer JDK merely exists.
java = "temurin-21"

# M5: the Flutter shell (SPEC §7, `app/`). **Pinned**, unlike `rust`, for two reasons: the
# Dart SDK version is what `app/pubspec.yaml`'s resolved dependency set was solved against,
# and a minor Flutter bump can change generated Gradle config under an Android build (see
# `app/README.md` § "Building the APK").
#
# The definition is spelled out rather than left to `flutter = "3.47.5"` because mise's
# registry entry for Flutter is an `http` backend with no built-in URL/checksum templates:
# this is what actually resolves a version to a tarball and verifies it. It lives here, at
# the repo root, so `mise run shell-test` works from anywhere in the tree (`app/mise.toml`
# used to hold it, which meant the tool existed only when your shell was inside `app/`).
flutter = { version = "3.47.5", checksum_expr = '"sha256:" + filter(fromJSON(body).releases, { #.archive endsWith filename })[0].sha256', platforms = { linux-x64 = { checksum_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json", url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_{{ version | trim_end(pat='-stable') }}-stable.tar.xz" }, macos-arm64 = { checksum_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_macos.json", url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_{{ version | trim_end(pat='-stable') }}-stable.zip" }, macos-x64 = { checksum_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_macos.json", url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_{{ version | trim_end(pat='-stable') }}-stable.zip" }, windows-x64 = { checksum_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_windows.json", url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_{{ version | trim_end(pat='-stable') }}-stable.zip" } }, version_expr = 'fromJSON(body).releases | filter({ #.channel == "stable" }) | map({ replace(#.version, "-stable", "") }) | sortVersions()', version_list_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json" }

# `.env` is read for every task, so `mise run dev` sees the same SESSION_SECRET /
# MONGO_URI the compose stack does. Copy `.env.example` to `.env` before your
# first run — the server refuses to start without SESSION_SECRET (SPEC §5.2).
[env]
_.file = { path = ".env", redact = true }

[tasks.dev]
description = "Run the server against the compose Mongo (mongo in docker, server on the host), serving the built PWA + plugins"
dir = "backend"
# The three M3 paths are passed explicitly and spelled relative to **this task's**
# directory. The defaults in `config.rs` (`plugins/base/dist`,
# `web/kernel-api/dist/kernel.d.ts`) are relative to the process's working directory, and
# this task runs in `backend/` — so unset they would resolve to `backend/plugins/…` and
# silently find nothing, which looks exactly like "the plugins failed to load".
#
# `WEB_DIST_DIR` makes http://localhost:8080 serve the last `mise run web-build` output,
# import map and all. `mise run app` is still the live-reloading way to work on the app
# (Vite on :5174, proxying /api, /plugins, /importmap.json and the socket here) — what
# this adds is the *production* path on the same machine: one origin, the real CSP, the
# real nonced import map, the real service worker. A missing bundle is not an error: the
# route says what to build.
run = [
  "docker compose -f ../docker-compose.yaml up -d --wait mongo",
  """
  WEB_DIST_DIR="${WEB_DIST_DIR:-../web/app/dist}" \
  PLUGINS_DIR="${PLUGINS_DIR:-../plugins/base/dist}" \
  KERNEL_DTS_PATH="${KERNEL_DTS_PATH:-../web/kernel-api/dist/kernel.d.ts}" \
  cargo run --bin life-manager -- serve
  """,
]

[tasks.check]
description = "Type-check the whole workspace (including tests) plus clippy"
dir = "backend"
run = [
  "cargo fmt --all --check",
  "cargo check --workspace --all-targets",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.fmt]
description = "Format the workspace in place"
dir = "backend"
run = "cargo fmt --all"

[tasks.test]
description = "Run the workspace test suite"
dir = "backend"
run = "cargo test --workspace --all-targets"

[tasks.build]
description = "Build the release binary (the same profile the Docker image uses)"
dir = "backend"
run = "cargo build --release --locked --bin life-manager"

[tasks.wasm-check]
description = "Check the shared core builds for the client kernel (no server deps, no bson)"
dir = "backend"
run = "cargo check -p life-manager-core --no-default-features"

[tasks.web]
description = "Run the web dev server (proxies /api and the sync socket to the Rust server)"
dir = "web"
run = ["npm install --no-audit --no-fund", "npm run dev"]

[tasks.app]
description = "Run the M3 PWA dev server (the real app; proxies /api, /plugins and the socket to the Rust server)"
dir = "web"
run = ["npm install --no-audit --no-fund", "npm run dev:app"]

[tasks.kernel-dts]
description = "Generate the plugin contract (web/kernel-api/dist/kernel.d.ts), served at /kernel.d.ts"
dir = "web"
run = ["npm install --no-audit --no-fund", "npm run kernel:dts"]

[tasks.plugins]
description = "Build the base plugin distribution into plugins/base/dist (what the server serves as PLUGINS_DIR)"
dir = "web"
run = ["npm install --no-audit --no-fund", "npm run build:plugins"]

[tasks.wasm-plugins]
description = "M4: build every plugin's backend half (wasm32) into the installed layout next to its frontend half"
# Ordered after `plugins` on purpose: the Vite build owns `emptyOutDir` for
# `plugins/base/dist/<id>/<version>`, so a `backend.wasm` written before it is deleted by
# it. `depends` makes that order explicit instead of a note in a README.
depends = ["plugins"]
run = "node web/scripts/build-wasm-plugins.mjs"

[tasks.plugin-package]
description = "M4: package a built plugin as the installable .zip of SPEC §6.2 (`mise run plugin-package doc-list`)"
# Packages the *built* directory (`plugins/base/dist/<id>/<version>`), which is already the
# installed layout, and writes exactly the allowlist the installer accepts — manifest,
# declared wasm module, `frontend/**`. A `zip -r` of the same directory is not equivalent:
# the installer rejects any entry outside that set by design (SPEC §6.2), so a stray file
# from a build tool fails the install naming a file the author did not know was there.
#
# `wasm-plugins`, not `plugins`: it depends on `plugins` itself and adds the backend
# halves *after* the Vite build, which owns `emptyOutDir` for those directories. Depending
# on `plugins` alone deleted the `backend.wasm` this task then could not find.
depends = ["wasm-plugins"]
run = "node web/scripts/package-plugin.mjs"

[tasks.plugin-check]
description = "M4: check the plugin SDK and every plugin backend half for wasm32 (they are excluded from the backend workspace)"
# `mise run check` covers `backend/`, and deliberately cannot cover these: the SDK links
# Extism's host imports, so a host-target build fails at link time.
#
# `--target wasm32-unknown-unknown` is spelled out rather than left to the
# `.cargo/config.toml` in each directory. Cargo discovers config files from the *current
# working directory* upward — not from the manifest's directory — so a `--manifest-path`
# invocation from the repo root never reads `plugins/.cargo/config.toml` and silently
# checks the host target instead, which is the opposite of what this task is for.
#
# `cargo fmt` is likewise not scoped by `--manifest-path` alone: its `--all` form walks the
# whole workspace it resolves, and from the repo root that reached into
# `backend/crates/server/src/pluginhost/**`. Both fmt lines run with an explicit `dir`.
run = [
  "cargo fmt --manifest-path backend/crates/plugin-sdk/Cargo.toml --check",
  "cargo clippy --manifest-path backend/crates/plugin-sdk/Cargo.toml --all-targets --target wasm32-unknown-unknown -- -D warnings",
  "cargo fmt --manifest-path plugins/Cargo.toml --all --check",
  "cargo clippy --manifest-path plugins/Cargo.toml --workspace --all-targets --target wasm32-unknown-unknown -- -D warnings",
]

# REMOVED (2026-09-24): `plugin-test` ran the host-target unit suite of `calendar-ics`, the
# pure parser crate beside the calendar plugin's wasm glue. The calendar plugin is gone and
# so is that crate, and `plugins/` now holds exactly one member — `examples/hello-backend`,
# a `cdylib` linking Extism's host imports, which *cannot* be tested on the host target.
# There is nothing left for this task to run, and a task that resolves to zero tests is
# worse than no task: it reports green.
#
# The pattern it enforced is still the right one and is documented in `backend/HOST-ABI.md`:
# put a plugin's real logic in a plain crate beside the wasm glue and unit-test it on the
# host. Bring this task back with the first plugin that has such a crate.

[tasks.plugin-smoke]
description = "M4: build the hello-world plugin and load it in a minimal Extism host (the ABI's end-to-end check)"
depends = ["wasm-plugins"]
dir = "backend"
run = "cargo test -p life-manager-server --test pluginhost_smoke"

[tasks.web-build]
description = "Build everything the server serves: the Wasm core, the contract, the PWA bundle (runtime layer + app + service worker), and the base plugins"
dir = "web"
# `wasm` first, and as a dependency rather than a documented prerequisite: the app bundle
# imports the shared core through a Vite alias into `kernel/src/wasm/pkg`, which is a
# gitignored build artifact — so in a fresh checkout `build:app` fails to resolve it, and
# in a stale one it silently bundles a core older than `backend/crates/core`. This is the
# same order `backend/Dockerfile` builds in.
depends = ["wasm"]
run = [
  "npm install --no-audit --no-fund",
  "npm run kernel:dts",
  "npm run build:app",
  "npm run build:plugins",
]

[tasks.web-check]
description = "Typecheck and unit-test the web tree: kernel contract, kernel runtime, PWA loader, base plugins"
dir = "web"
run = ["npm install --no-audit --no-fund", "npm run typecheck", "npm run test"]

[tasks.shell-test]
description = "M5: the Flutter shell gate — format, analyze and unit-test app/"
dir = "app"
# The gate for `app/`, and the exact analogue of `mise run check` + `mise run test` for
# `backend/`. Three things in one task because all three have to hold before a shell change
# is worth reviewing, and none of them needs an Android SDK, an emulator or a device:
# `flutter analyze` and `flutter test` run on the host Dart VM.
#
# `dart format --set-exit-if-changed` is first for the same reason `cargo fmt --check` is
# first in `check`: it is the cheapest failure and the one most likely to produce a diff that
# hides the real change.
#
# `flutter pub get` is included rather than assumed: `pubspec.lock` is committed, and a fresh
# checkout has no `.dart_tool`, so without it the first run of this task fails with a
# missing-package error that looks like a broken pubspec.
run = [
  "flutter pub get",
  "dart format --output=none --set-exit-if-changed lib test",
  "flutter analyze",
  "flutter test",
]

[tasks.shell-apk]
description = "M5: build the Android debug APK (the milestone's build gate) — needs an Android SDK"
dir = "app"
# The gate `shell-test` deliberately is not: it compiles Dart *and* every plugin's Android
# half, which is where a toolchain mismatch actually shows up. Run it before shipping a
# change to `app/android/**`, `pubspec.yaml`, or the Flutter pin.
#
# `ANDROID_HOME` is defaulted rather than required because `android/local.properties`
# (gitignored, written once — see `app/README.md`) already carries `sdk.dir`; the export is
# for the plugins that read the environment instead. The JDK comes from `[tools]` above, and
# that pin is load-bearing: see the comment there.
run = '''
set -euo pipefail
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
export ANDROID_SDK_ROOT="$ANDROID_HOME"
if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
  echo "no Android SDK at $ANDROID_HOME — see app/README.md § Building the APK" >&2
  exit 1
fi
flutter build apk "${@:---debug}"
'''

[tasks.harness]
description = "Convergence harness against a running server (SPEC §9 M2)"
dir = "web"
run = "npm run harness:convergence --"

[tasks.wasm]
description = "Build the shared core to Wasm for the client kernel (writes web/kernel/src/wasm/pkg)"
run = '''
set -euo pipefail

target="wasm32-unknown-unknown"
out="web/kernel/src/wasm/pkg"
artifact="backend/target/$target/release/life_manager_core.wasm"

# The target has to be installed once: `rustup target add wasm32-unknown-unknown`.
if ! rustc --print target-list | grep -qx "$target"; then
  echo "rustc does not know $target" >&2; exit 1
fi
if ! ls "$(rustc --print sysroot)/lib/rustlib/$target" >/dev/null 2>&1; then
  echo "missing std for $target — run: rustup target add $target" >&2; exit 1
fi

# `wasm-bindgen` must match the wasm-bindgen crate version in
# backend/crates/core/Cargo.toml exactly (it refuses to run otherwise):
#   cargo install wasm-bindgen-cli --version <that version>
# or drop the prebuilt binary from the wasm-bindgen releases on your PATH.
if command -v wasm-bindgen >/dev/null 2>&1; then
  generate() { wasm-bindgen --target web --out-dir "$out" --out-name life_manager_core "$artifact"; }
elif command -v wasm-pack >/dev/null 2>&1; then
  # wasm-pack drives the same code generator; it also writes a package.json we
  # do not use (the kernel imports the artifact directly through a Vite alias).
  generate() {
    wasm-pack build backend/crates/core --target web --release --out-dir "../../../$out" \
      --out-name life_manager_core -- --no-default-features --features wasm
  }
else
  echo "neither wasm-bindgen nor wasm-pack is on PATH — see the comment in this task" >&2
  exit 1
fi

cd backend
cargo build -p life-manager-core --target "$target" --release --no-default-features --features wasm
cd ..
mkdir -p "$out"
generate
node web/scripts/wasm-smoke.mjs
'''

[tasks.up]
description = "Build and start the full stack (mongo + server) in Docker"
run = "docker compose up --build -d"

[tasks.down]
description = "Stop the stack, keeping the Mongo volume"
run = "docker compose down"

[tasks.logs]
description = "Tail the server logs"
run = "docker compose logs -f server"

[tasks.backup]
description = "Dump the database (documents + GridFS attachments) to ./backups — see docs/OPERATIONS.md"
run = '''
set -euo pipefail
stamp="$(date -u +%Y%m%dT%H%M%SZ)"
out="backups/${stamp}"
mkdir -p "$out"
docker compose exec -T mongo mongodump \
  --db "${MONGO_DATABASE:-life_manager}" --archive --gzip > "$out/dump.archive.gz"
echo "wrote $out/dump.archive.gz"
'''

[tasks.adb-pair]
description = "Pair with a phone over Wi-Fi debugging: mise run adb-pair <ip:pairing-port> <6-digit-code> (then auto-connects via mDNS)"
run = """
#!/usr/bin/env bash
set -euo pipefail
ADB="${ANDROID_HOME:-$HOME/Android/Sdk}/platform-tools/adb"
PAIR="{{arg(name='pair_hostport')}}"
CODE="{{arg(name='code')}}"
"$ADB" pair "$PAIR" "$CODE"
echo "Paired. Discovering connect endpoint via mDNS..."
sleep 1
SVC=$("$ADB" mdns services 2>/dev/null | awk '/_adb-tls-connect/{print $NF; exit}')
if [ -n "${SVC:-}" ]; then
  "$ADB" connect "$SVC"
else
  echo "mDNS discovery came up empty — connect manually with the IP:port from the MAIN Wireless-debugging screen:"
  echo "  $ADB connect <ip:port>"
fi
"$ADB" devices -l
"""

[tasks.shell-install]
description = "Install the shell APK on the connected phone (adb reverse + install -r); pass --logs to stream flutter logcat afterwards"
run = """
#!/usr/bin/env bash
set -euo pipefail
ADB="${ANDROID_HOME:-$HOME/Android/Sdk}/platform-tools/adb"
APK="app/build/app/outputs/flutter-apk/app-debug.apk"
[ -f "$APK" ] || { echo "no APK at $APK — build it first: mise run shell-apk"; exit 1; }
COUNT=$("$ADB" devices | awk 'NR>1 && $2=="device"' | wc -l)
[ "$COUNT" -ge 1 ] || { echo "no device attached — connect USB or: mise run adb-pair <ip:port> <code>"; exit 1; }
if [ "$COUNT" -gt 1 ] && [ -z "${ANDROID_SERIAL:-}" ]; then
  echo "multiple devices attached (often the same phone connected twice over Wi-Fi):"
  "$ADB" devices | awk 'NR>1 && $2=="device"{print "  " $1}'
  echo "either: adb disconnect <the duplicate>   or: ANDROID_SERIAL=<serial> mise run shell-install"
  exit 1
fi
"$ADB" reverse tcp:8080 tcp:8080
"$ADB" install -r "$APK"
echo "installed. server URL on the phone: http://127.0.0.1:8080"
if [ "${1:-}" = "--logs" ]; then
  "$ADB" logcat -c
  exec "$ADB" logcat -s flutter:V
fi
"""

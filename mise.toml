[tools]
rust = "latest"

# `.env` is read for every task, so `mise run dev` sees the same SESSION_SECRET /
# MONGO_URI the compose stack does. Copy `.env.example` to `.env` before your
# first run — the server refuses to start without SESSION_SECRET (SPEC §5.2).
[env]
_.file = { path = ".env", redact = true }

[tasks.dev]
description = "Run the server against the compose Mongo (mongo in docker, server on the host), serving the built PWA + plugins"
dir = "backend"
# The three M3 paths are passed explicitly and spelled relative to **this task's**
# directory. The defaults in `config.rs` (`plugins/base/dist`,
# `web/kernel-api/dist/kernel.d.ts`) are relative to the process's working directory, and
# this task runs in `backend/` — so unset they would resolve to `backend/plugins/…` and
# silently find nothing, which looks exactly like "the plugins failed to load".
#
# `WEB_DIST_DIR` makes http://localhost:8080 serve the last `mise run web-build` output,
# import map and all. `mise run app` is still the live-reloading way to work on the app
# (Vite on :5174, proxying /api, /plugins, /importmap.json and the socket here) — what
# this adds is the *production* path on the same machine: one origin, the real CSP, the
# real nonced import map, the real service worker. A missing bundle is not an error: the
# route says what to build.
run = [
  "docker compose -f ../docker-compose.yaml up -d --wait mongo",
  """
  WEB_DIST_DIR="${WEB_DIST_DIR:-../web/app/dist}" \
  PLUGINS_DIR="${PLUGINS_DIR:-../plugins/base/dist}" \
  KERNEL_DTS_PATH="${KERNEL_DTS_PATH:-../web/kernel-api/dist/kernel.d.ts}" \
  cargo run --bin life-manager -- serve
  """,
]

[tasks.check]
description = "Type-check the whole workspace (including tests) plus clippy"
dir = "backend"
run = [
  "cargo fmt --all --check",
  "cargo check --workspace --all-targets",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.fmt]
description = "Format the workspace in place"
dir = "backend"
run = "cargo fmt --all"

[tasks.test]
description = "Run the workspace test suite"
dir = "backend"
run = "cargo test --workspace --all-targets"

[tasks.build]
description = "Build the release binary (the same profile the Docker image uses)"
dir = "backend"
run = "cargo build --release --locked --bin life-manager"

[tasks.wasm-check]
description = "Check the shared core builds for the client kernel (no server deps, no bson)"
dir = "backend"
run = "cargo check -p life-manager-core --no-default-features"

[tasks.web]
description = "Run the web dev server (proxies /api and the sync socket to the Rust server)"
dir = "web"
run = ["npm install --no-audit --no-fund", "npm run dev"]

[tasks.app]
description = "Run the M3 PWA dev server (the real app; proxies /api, /plugins and the socket to the Rust server)"
dir = "web"
run = ["npm install --no-audit --no-fund", "npm run dev:app"]

[tasks.kernel-dts]
description = "Generate the plugin contract (web/kernel-api/dist/kernel.d.ts), served at /kernel.d.ts"
dir = "web"
run = ["npm install --no-audit --no-fund", "npm run kernel:dts"]

[tasks.plugins]
description = "Build the base plugin distribution into plugins/base/dist (what the server serves as PLUGINS_DIR)"
dir = "web"
run = ["npm install --no-audit --no-fund", "npm run build:plugins"]

[tasks.web-build]
description = "Build everything the server serves: the Wasm core, the contract, the PWA bundle (runtime layer + app + service worker), and the base plugins"
dir = "web"
# `wasm` first, and as a dependency rather than a documented prerequisite: the app bundle
# imports the shared core through a Vite alias into `kernel/src/wasm/pkg`, which is a
# gitignored build artifact — so in a fresh checkout `build:app` fails to resolve it, and
# in a stale one it silently bundles a core older than `backend/crates/core`. This is the
# same order `backend/Dockerfile` builds in.
depends = ["wasm"]
run = [
  "npm install --no-audit --no-fund",
  "npm run kernel:dts",
  "npm run build:app",
  "npm run build:plugins",
]

[tasks.web-check]
description = "Typecheck and unit-test the web tree: kernel contract, kernel runtime, PWA loader, base plugins"
dir = "web"
run = ["npm install --no-audit --no-fund", "npm run typecheck", "npm run test"]

[tasks.harness]
description = "Convergence harness against a running server (SPEC §9 M2)"
dir = "web"
run = "npm run harness:convergence --"

[tasks.wasm]
description = "Build the shared core to Wasm for the client kernel (writes web/kernel/src/wasm/pkg)"
run = '''
set -euo pipefail

target="wasm32-unknown-unknown"
out="web/kernel/src/wasm/pkg"
artifact="backend/target/$target/release/life_manager_core.wasm"

# The target has to be installed once: `rustup target add wasm32-unknown-unknown`.
if ! rustc --print target-list | grep -qx "$target"; then
  echo "rustc does not know $target" >&2; exit 1
fi
if ! ls "$(rustc --print sysroot)/lib/rustlib/$target" >/dev/null 2>&1; then
  echo "missing std for $target — run: rustup target add $target" >&2; exit 1
fi

# `wasm-bindgen` must match the wasm-bindgen crate version in
# backend/crates/core/Cargo.toml exactly (it refuses to run otherwise):
#   cargo install wasm-bindgen-cli --version <that version>
# or drop the prebuilt binary from the wasm-bindgen releases on your PATH.
if command -v wasm-bindgen >/dev/null 2>&1; then
  generate() { wasm-bindgen --target web --out-dir "$out" --out-name life_manager_core "$artifact"; }
elif command -v wasm-pack >/dev/null 2>&1; then
  # wasm-pack drives the same code generator; it also writes a package.json we
  # do not use (the kernel imports the artifact directly through a Vite alias).
  generate() {
    wasm-pack build backend/crates/core --target web --release --out-dir "../../../$out" \
      --out-name life_manager_core -- --no-default-features --features wasm
  }
else
  echo "neither wasm-bindgen nor wasm-pack is on PATH — see the comment in this task" >&2
  exit 1
fi

cd backend
cargo build -p life-manager-core --target "$target" --release --no-default-features --features wasm
cd ..
mkdir -p "$out"
generate
node web/scripts/wasm-smoke.mjs
'''

[tasks.up]
description = "Build and start the full stack (mongo + server) in Docker"
run = "docker compose up --build -d"

[tasks.down]
description = "Stop the stack, keeping the Mongo volume"
run = "docker compose down"

[tasks.logs]
description = "Tail the server logs"
run = "docker compose logs -f server"

[tasks.backup]
description = "Dump the database (documents + GridFS attachments) to ./backups — see docs/OPERATIONS.md"
run = '''
set -euo pipefail
stamp="$(date -u +%Y%m%dT%H%M%SZ)"
out="backups/${stamp}"
mkdir -p "$out"
docker compose exec -T mongo mongodump \
  --db "${MONGO_DATABASE:-life_manager}" --archive --gzip > "$out/dump.archive.gz"
echo "wrote $out/dump.archive.gz"
'''

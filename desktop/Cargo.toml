[package]
name = "ddd-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
description = "Linux desktop shell for ddd: the server's PWA in a WebKitGTK window"

[workspace]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.6"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
url = "2"
notify = "8"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

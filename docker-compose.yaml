# Local / self-host deployment (SPEC §8).
#
# Production is Kubernetes, explicitly single-replica; this file is the
# local + self-host path. Since M3 the image contains the PWA bundle and the base
# plugin distribution as well as the binary, so `docker compose up --build` gives a
# complete app on http://localhost:8080 — no Vite, no separate frontend deploy.
#
# First run:
#   cp .env.example .env    # then put a real SESSION_SECRET in it
#   docker compose up --build
#
# `mise run dev` uses only the `mongo` service and runs the server on the host,
# which is why mongo's port is published on loopback.
#
# The `caddy` profile adds automatic HTTPS in front of the server, which a real
# self-host deployment needs — Secure cookies, the PWA and the Flutter bridge all
# require a secure origin (SPEC §8):
#
#   DOMAIN=notes.example.com ACME_EMAIL=you@example.com \
#     APP_ORIGIN=https://notes.example.com COOKIE_SECURE=true \
#     TRUST_PROXY_HEADERS=true SERVER_PORT=127.0.0.1:8080 \
#     docker compose --profile caddy up -d --build
#
# `SERVER_PORT=127.0.0.1:8080` there is not decoration: `TRUST_PROXY_HEADERS=true` lets a
# request pick its own client IP, so it is only safe while the proxy is the *only* route
# in. See `deploy/Caddyfile`.

name: life-manager

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["--bind_ip_all"]
    # WiredTiger opens a file per collection/index and aborts the process when it
    # runs out of descriptors. Docker's default soft limit (1024) is reached by the
    # M2 test suites, which create a throwaway database per test.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-life_manager}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Loopback only: `mise run dev` connects from the host, nothing else should.
    # There is no authentication on this mongo — do not bind it to 0.0.0.0.
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"

  server:
    build:
      # The repository root, not `backend/`: since M3 the image also builds the PWA
      # bundle, the base plugins and the plugin contract out of `web/` and `plugins/`
      # (see the header of `backend/Dockerfile`). `.dockerignore` is what keeps that
      # context small.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-life_manager}
      BIND_ADDR: 0.0.0.0:8080
      # Required, >= 32 bytes, no default (SPEC §5.2). Rotating it logs everyone out.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required and must be at least 32 bytes}
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-104857600}
      # Origin allowlist: CORS *and* the mandatory WebSocket origin check. Since M3 the
      # server serves the PWA itself, so its own origin must be in here or the page loads
      # and the socket is refused with 403 before it authenticates (PROTOCOL.md §1.2).
      # Behind the caddy profile this becomes https://${DOMAIN}.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:${SERVER_PORT:-8080}}

      # ---- M3: the static surface (SPEC §6.4, §8) ----
      # The image bakes all three (see `backend/Dockerfile`); these only need overriding
      # to point at a mounted directory, which is what M4's plugin installer will want.
      WEB_DIST_DIR: ${WEB_DIST_DIR:-/srv/web}
      PLUGINS_DIR: ${PLUGINS_DIR:-/srv/plugins}
      KERNEL_DTS_PATH: ${KERNEL_DTS_PATH:-/srv/kernel.d.ts}
      # Server-side safe mode (SPEC §6.1): every client is told the plugin list is empty,
      # which is the way back in when an installed plugin breaks the app for everyone.
      DISABLE_PLUGINS: ${DISABLE_PLUGINS:-false}
      # Compose runs over plain http on localhost; production keeps this true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # No reverse proxy in M1 (see the header of this file): the client IP is
      # the connection's peer address and X-Forwarded-For is ignored, so a client
      # cannot pick its own per-IP login bucket (SPEC §5.2) or forge the `ip` on
      # audit entries (SPEC §5.4). Flip to true only once something like the
      # caddy block below is the *only* route to the server.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      RUST_LOG: ${RUST_LOG:-info,life_manager_server=debug}
      # Must stay below stop_grace_period (SPEC §8: exit within 30 s).
      SHUTDOWN_GRACE_SECS: ${SHUTDOWN_GRACE_SECS:-30}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      # Liveness (never touches Mongo). `bash` rather than CMD-SHELL's dash:
      # /dev/tcp is a bash feature, and the image ships no curl.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && grep -q "200 OK" <&3'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Longer than SHUTDOWN_GRACE_SECS so the server's own watchdog is what ends
    # the process, not docker's SIGKILL.
    stop_grace_period: 40s

  # Automatic HTTPS in front of the server (SPEC §8). Opt-in, because a plain
  # `docker compose up` on a laptop wants http://localhost:8080 and has no domain to
  # get a certificate for. The server stays TLS-unaware; Caddy terminates.
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      # The name the certificate is issued for; it must resolve to this host. The
      # default is deliberately `localhost`, for which Caddy issues a certificate from
      # its own local CA instead of calling ACME — so a mistyped invocation fails on a
      # browser warning rather than by burning Let's Encrypt rate limit on a bad name.
      # It cannot be `${DOMAIN:?…}`: Compose interpolates every service before it filters
      # by profile, so a required variable here would break plain `docker compose up`.
      DOMAIN: ${DOMAIN:-localhost}
      # Optional: an address for ACME expiry notices.
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mongo-data:
  mongo-config:
  caddy-data:
  caddy-config:

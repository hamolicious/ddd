name: ddd

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["--bind_ip_all"]
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-ddd}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"

  server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-ddd}
      PORT: 8081
      BIND_ADDR: 0.0.0.0:${PORT:-8080}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required and must be at least 32 bytes}
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-104857600}
      APP_ORIGIN: ${APP_ORIGIN:-}
      APP_ORIGIN_HOSTS: ${APP_ORIGIN_HOSTS:-}

      WEB_DIST_DIR: ${WEB_DIST_DIR:-/srv/web}
      PLUGINS_DIR: ${PLUGINS_DIR:-/srv/plugins}
      KERNEL_DTS_PATH: ${KERNEL_DTS_PATH:-/srv/kernel.d.ts}
      DISABLE_PLUGINS: ${DISABLE_PLUGINS:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      RUST_LOG: ${RUST_LOG:-info,ddd_server=debug}
      SHUTDOWN_GRACE_SECS: ${SHUTDOWN_GRACE_SECS:-30}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/${PORT:-8080} && printf "GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && grep -q "200 OK" <&3'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 40s

volumes:
  mongo-data:
  mongo-config:

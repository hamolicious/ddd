[package]
name = "ddd-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
description = "`ddd`: developer tooling for ddd (scaffolding plugin projects first)."

[workspace]

[[bin]]
name = "ddd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
ureq = { version = "3.4.2", features = ["json"] }
ddd-core = { path = "../backend/crates/core", default-features = false }
